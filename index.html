<title>Lugalong</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
  /* Layout concept: ein Anschlagbrett im Bahnhofsgang. Zettel mit Stecknadel und Abreissstreifen fuer den Kontakt, eine schmale Spalte fuer das Handy. */
  :root {
    --bg: #E8EDEA;
    --paper: #FBFBF7;
    --ink: #14262B;
    --muted: #55686C;
    --line: #C5D1CF;
    --accent: #0B6E6E;
    --accent-ink: #FFFFFF;
    --offer-bg: #D5ECE9;
    --offer-ink: #0A4F52;
    --seek-bg: #F6E4D3;
    --seek-ink: #8A3E10;
    --ad-bg: #EFE9D2;
    --ad-ink: #5C4A0E;
    --star: #B7791F;
    --pin: #B23A2E;
    --error: #A3261B;
    --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1A1D;
      --paper: #172428;
      --ink: #E6EFEE;
      --muted: #93A6A8;
      --line: #2B3D41;
      --accent: #4DC2BD;
      --accent-ink: #04201F;
      --offer-bg: #12373A;
      --offer-ink: #9BE0DB;
      --seek-bg: #3A2616;
      --seek-ink: #F0B488;
      --ad-bg: #3A3314;
      --ad-ink: #EBD98A;
      --star: #F2B84B;
      --pin: #E0675A;
      --error: #FF9C90;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1A1D;
    --paper: #172428;
    --ink: #E6EFEE;
    --muted: #93A6A8;
    --line: #2B3D41;
    --accent: #4DC2BD;
    --accent-ink: #04201F;
    --offer-bg: #12373A;
    --offer-ink: #9BE0DB;
    --seek-bg: #3A2616;
    --seek-ink: #F0B488;
    --ad-bg: #3A3314;
    --ad-ink: #EBD98A;
    --star: #F2B84B;
    --pin: #E0675A;
    --error: #FF9C90;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 12px 40px;
  }
  .wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
  h1, h2, h3 { font-family: var(--font-display); font-stretch: 78%; font-weight: 800; letter-spacing: 0.01em; line-height: 1.05; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(2.6rem, 12vw, 4.4rem); text-transform: uppercase; line-height: 0.98; }
  h1.mid { font-size: clamp(2.1rem, 9vw, 3.2rem); }
  h1.long { font-size: clamp(1.6rem, 7vw, 2.6rem); }
  h1, h2, h3 { overflow-wrap: anywhere; }
  h2 { font-size: 1.7rem; text-transform: uppercase; }
  h3 { font-size: 1.3rem; text-transform: uppercase; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; padding-block: 4px 12px; border-bottom: 1px solid var(--line); }
  .brand { font-family: var(--font-display); font-stretch: 78%; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
  .region { font-family: var(--font-body); font-stretch: 100%; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .navbtn { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 4px; padding: 6px 9px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .navbtn[aria-current="page"] { background: var(--ink); color: var(--bg); }
  .navbtn .count { background: var(--ink); color: var(--bg); border-radius: 3px; padding: 0 6px; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
  .navbtn[aria-current="page"] .count { background: var(--bg); color: var(--ink); }

  .lead { color: var(--muted); font-size: 1.1rem; max-width: 52ch; }
  .stepline, .eyebrow { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .eyebrow { color: var(--accent); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .section { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
  .choices { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 480px) { .choices { grid-template-columns: 1fr 1fr; } }
  .choice { text-align: left; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-width: 0; }
  .choice:hover { background: var(--ink); color: var(--paper); }
  .choice svg { width: 44px; height: 44px; }
  .choice .t { font-family: var(--font-display); font-stretch: 78%; font-weight: 800; font-size: 1.4rem; text-transform: uppercase; line-height: 1.05; }
  .choice .d { font-size: 0.95rem; color: var(--muted); }
  .choice:hover .d { color: var(--paper); opacity: 0.85; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; align-self: flex-start; text-align: left; }
  .linkbtn.sm { font-size: 0.9rem; }

  .hero { display: flex; flex-direction: column; gap: 16px; padding-top: 10px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 2px solid var(--accent); border-radius: 5px; padding: 13px 18px; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
  .primary:hover { filter: brightness(1.08); }
  .secondary { background: transparent; color: var(--ink); border: 2px solid var(--ink); border-radius: 5px; padding: 13px 18px; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
  .secondary:hover { background: var(--ink); color: var(--bg); }
  .map { width: 100%; height: auto; display: block; }
  .map text { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; fill: var(--ink); text-transform: uppercase; }
  .map .small { font-family: var(--font-body); font-stretch: 100%; font-weight: 600; text-transform: none; fill: var(--muted); }
  .map .base { fill: none; stroke: var(--line); stroke-width: 4; stroke-linecap: round; }
  .map .draw { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 520; animation: draw 1.6s ease-out both; }
  .map .stop { fill: var(--paper); stroke: var(--ink); stroke-width: 3; }
  .map .slipbox { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
  .map .pinhead { fill: var(--pin); }
  .map .offertag { fill: var(--offer-ink); font-size: 10px; letter-spacing: 0.08em; }
  .map .seektag { fill: var(--seek-ink); font-size: 10px; letter-spacing: 0.08em; }
  @keyframes draw { from { stroke-dashoffset: 520; } }

  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .steps li { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; }
  .steps .n { font-family: var(--font-display); font-stretch: 70%; font-weight: 900; font-size: 3rem; line-height: 0.9; color: var(--accent); }
  .steps h3 { margin-bottom: 4px; }
  .steps p, .cols p, .principles p, .facts dd { color: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 560px) { .cols { grid-template-columns: repeat(3, 1fr); } }
  .col { border-top: 3px solid var(--ink); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .prose { display: flex; flex-direction: column; gap: 12px; max-width: 58ch; }
  .principles { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .principles li { border-left: 3px solid var(--accent); padding-left: 12px; display: flex; flex-direction: column; gap: 3px; }
  .facts { margin: 0; display: grid; grid-template-columns: 1fr; gap: 10px; border-top: 3px solid var(--ink); padding-top: 12px; }
  @media (min-width: 480px) { .facts { grid-template-columns: 1fr 1fr; } }
  .facts div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .facts dt { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .facts dd { margin: 0; color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
  .cta { background: var(--ink); color: var(--bg); border-radius: 6px; padding: 22px 16px; display: flex; flex-direction: column; gap: 12px; }
  .cta h2 { color: var(--bg); }
  .cta .primary { align-self: flex-start; background: var(--bg); color: var(--ink); border-color: var(--bg); }
  .contactline { font-weight: 600; user-select: all; overflow-wrap: anywhere; }
  .supporters { border: 2px dashed var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }

  form { display: flex; flex-direction: column; gap: 16px; }
  .row2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 480px) { .row2 { grid-template-columns: 1fr 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field label { font-weight: 600; font-size: 0.95rem; }
  .field .hint { font-size: 0.85rem; color: var(--muted); }
  .field input, .field select, .field textarea { width: 100%; min-width: 0; box-sizing: border-box; background: var(--paper); border: 1.5px solid var(--line); border-radius: 5px; padding: 10px 12px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { min-height: 96px; resize: vertical; }
  .field .err { color: var(--error); font-size: 0.88rem; font-weight: 600; }
  .field.bad input, .field.bad select, .field.bad textarea { border-color: var(--error); }
  .formnote { font-size: 0.88rem; color: var(--muted); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 5px; overflow: hidden; }
  .seg button { background: transparent; border: 0; padding: 7px 12px; font-weight: 600; cursor: pointer; border-right: 1.5px solid var(--ink); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .board { display: flex; flex-direction: column; gap: 22px; }
  .slip { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 0 var(--line); }
  .slip::before { content: ""; position: absolute; top: 7px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--pin); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .slip.ad { background: var(--ad-bg); border-style: dashed; padding-bottom: 16px; }
  .slip.ad::before { background: var(--ad-ink); }
  .slip .head { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .tag { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; }
  .tag.offer { background: var(--offer-bg); color: var(--offer-ink); }
  .tag.seek { background: var(--seek-bg); color: var(--seek-ink); }
  .tag.adtag { background: var(--ad-ink); color: var(--ad-bg); }
  .tag.plain { border: 1px solid var(--line); color: var(--muted); }
  .route { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 1.55rem; line-height: 1.1; text-transform: uppercase; overflow-wrap: anywhere; }
  .route .arrow { color: var(--accent); padding-inline: 4px; }
  .slip.ad .route { color: var(--ad-ink); }
  .when { font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail { color: var(--muted); }
  .slip.ad .detail { color: var(--ad-ink); }
  .price { font-weight: 700; font-variant-numeric: tabular-nums; }
  .note { font-style: italic; overflow-wrap: anywhere; }
  .match { font-size: 0.9rem; font-weight: 700; color: var(--accent); }
  .person { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .person .pname { font-weight: 700; }
  .rate-sum { font-variant-numeric: tabular-nums; font-weight: 600; }
  .rate-sum .glyph { color: var(--star); }
  .rate-sum.new { font-weight: 500; color: var(--muted); }
  .reviews { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; border-left: 3px solid var(--line); padding-left: 12px; }
  .reviews li { display: flex; flex-direction: column; gap: 2px; }
  .reviews .rstars { color: var(--star); letter-spacing: 0.1em; }
  .reviews .rmeta { font-size: 0.82rem; color: var(--muted); }
  .reviews .rtxt { overflow-wrap: anywhere; }
  .reviews .rnote { font-size: 0.85rem; color: var(--muted); font-style: italic; }
  .tear { margin-top: 6px; border-top: 2px dashed var(--line); margin-inline: -16px; padding: 10px 16px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
  .tear .contact { font-weight: 600; overflow-wrap: anywhere; user-select: all; }
  .tear .who { color: var(--muted); font-size: 0.9rem; }
  .tear button { background: var(--ink); color: var(--bg); border: 0; border-radius: 4px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
  .tear button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .tear .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .ratepanel { margin-inline: -16px; border-top: 2px dashed var(--line); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .ratepanel h3 { font-size: 1.1rem; }
  .starpick { display: flex; gap: 6px; }
  .starpick button { width: 44px; height: 44px; border: 1.5px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer; }
  .starpick button.on { color: var(--star); border-color: var(--star); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); border-radius: 4px; background: var(--paper); padding: 6px 10px; font-weight: 600; font-size: 0.92rem; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ratepanel .err { color: var(--error); font-size: 0.88rem; font-weight: 600; }
  .ratepanel .btnrow button { padding: 10px 14px; font-size: 1rem; }

  .pkgs { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .pkg { background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pkg.best { border-color: var(--accent); }
  .pkg .pr { font-family: var(--font-display); font-stretch: 78%; font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .pkg .pr small { font-family: var(--font-body); font-stretch: 100%; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
  .pkg ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
  .pkg .primary, .pkg .secondary { align-self: flex-start; padding: 10px 14px; font-size: 1rem; }

  .empty { border: 2px dashed var(--line); border-radius: 6px; padding: 24px 16px; color: var(--muted); text-align: center; }
  .done { background: var(--offer-bg); color: var(--offer-ink); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .done h2 { color: var(--offer-ink); }
  .done.warn { background: var(--seek-bg); color: var(--seek-ink); }
  .done.warn h2 { color: var(--seek-ink); }
  .copybox { width: 100%; box-sizing: border-box; min-height: 140px; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 5px; padding: 10px 12px; font: inherit; resize: vertical; }
  footer { font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .footlinks { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .legal { display: flex; flex-direction: column; gap: 18px; max-width: 62ch; }
  .legal section { display: flex; flex-direction: column; gap: 8px; }
  .legal h2 { font-size: 1.35rem; }
  .legal ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .sponsor-demo { border: 2px dashed var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .sponsor-demo .line { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; overflow-wrap: anywhere; }
  .sponsor-demo .by { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ad-ink); }
  .pkg .unit { font-size: 0.9rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="brandBtn" type="button" aria-label="Zur Startseite"><span id="brandName"></span><span class="region" id="regionTag"></span></button>
    <nav class="nav" aria-label="Hauptmenü">
      <button class="navbtn" id="boardBtn" type="button">Brett <span class="count" id="boardCount">0</span></button>
      <button class="navbtn" id="adsBtn" type="button">Werben</button>
      <button class="navbtn" id="aboutBtn" type="button">Über uns</button>
      <button class="navbtn" id="contactBtn" type="button">Kontakt</button>
    </nav>
  </header>
  <main id="view" class="stack" aria-live="polite"></main>
  <footer>
    <p>Prototyp zum Ausprobieren. Zettel und Bewertungen bleiben nur in deinem Browser und sind für andere nicht sichtbar. Haftung und Versicherung sind noch nicht geregelt. Die Beispiele sind erfunden.</p>
    <div class="footlinks">
      <button class="linkbtn sm" id="impBtn" type="button">Impressum</button>
      <button class="linkbtn sm" id="dsBtn" type="button">Datenschutzerklärung</button>
    </div>
  </footer>
</div>

<script>
(function () {
  var BRAND = "Lugalong";
  var REGION = "Luzern";
  // Optional ausfuellen. Leer lassen blendet die Kontaktzeile aus.
  var CONTACT = "";
  // Fuer das Impressum. Leer lassen zeigt "wird vor dem Start ergaenzt".
  var ADDRESS = "";
  var LEGAL_FORM = "";
  // Solange true, zeigen Impressum und Datenschutz den Hinweis "Entwurf".
  var LEGAL_DRAFT = true;
  var HOSTING = "GitHub Pages (GitHub Inc., USA)";
  // Optional. Adresse eines Formular-Dienstes (z. B. Formspree). Leer heisst: Nachricht wird zum Kopieren angezeigt.
  var FORM_ENDPOINT = "";
  var STORE_KEY = "mitgenommen-zettel-v1";
  var RATE_KEY = "lugalong-ratings-v1";
  var WINDOWS = ["Morgens", "Mittags", "Nachmittags", "Abends", "Flexibel"];
  var ITEMS = ["Koffer", "Rucksack", "Velo", "Ski oder Snowboard", "Material oder Paket", "Anderes"];
  var CAPS = ["Platz für einen Rucksack", "Kofferraum klein", "Kofferraum gross", "Anhänger oder Transporter"];
  var TOPICS = ["Frage", "Problem", "Hinweis oder Idee", "Zettel melden"];

  // Platzhalter-Preise und Bedingungen. Vor dem Start pruefen und anpassen.
  // Werbung = Verkaufsbotschaft, klar als Anzeige markiert. Sponsoring = Unterstuetzung mit Name und Logo, ohne Verkaufsbotschaft.
  var PACKAGES = {
    werbung: [
      { key: "w-text", name: "Textanzeige", price: 49, unit: "pro Monat", lines: ["Ein kurzer Anzeigentext mit Link zwischen den Zetteln", "Klar als Anzeige markiert", "Monatlich kündbar"] },
      { key: "w-bild", name: "Bildanzeige", price: 149, unit: "pro Monat", best: true, lines: ["Anzeigenzettel mit Bild und Link", "Weiter oben auf dem Brett", "Klar als Anzeige markiert", "Monatlich kündbar"] },
      { key: "w-top", name: "Top-Platz", price: 390, unit: "pro Monat", lines: ["Exklusiv pro Region und Branche", "Oben am Brett und auf der Startseite", "Alles aus Bildanzeige"] }
    ],
    sponsoring: [
      { key: "s-unterstuetzer", name: "Unterstützer", price: 290, unit: "pro Jahr", lines: ["Name und Link unter «Unterstützt von» auf Startseite und Brett", "Keine Verkaufsbotschaft, nur Name und Logo", "Für Betriebe, Vereine und Gemeinden"] },
      { key: "s-pate", name: "Strecken-Pate", price: 590, unit: "pro Jahr", best: true, lines: ["Dein Name bei einer Strecke, zum Beispiel «Luzern → Weggis, präsentiert von …»", "Alles aus Unterstützer", "Strecke nach Absprache"] },
      { key: "s-partner", name: "Regionspartner", price: 1490, unit: "pro Jahr", lines: ["Logo auf Startseite und «Über uns»", "Nennung als Partner der Region", "Gemeinsame Aktion nach Absprache", "Alles aus Strecken-Pate"] }
    ]
  };
  function allPackages() { return PACKAGES.werbung.concat(PACKAGES.sponsoring); }
  function chf(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "’"); }

  function copyText(text, node, btn) {
    function fallback() {

        if (node.select) { node.focus(); node.select(); }
        else { var r = document.createRange(); r.selectNodeContents(node); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      } catch (x) { /* nichts */ }
      btn.textContent = "Zum Kopieren markiert";
    }
    try {
      if (!navigator.clipboard) { fallback(); return; }
      navigator.clipboard.writeText(text).then(function () { btn.textContent = "Kopiert"; }, fallback);
    } catch (x) { fallback(); }
  }

  function sendForm(kind, pairs) {
    var text = pairs.map(function (p) { return p[0] + ": " + p[1]; }).join("\n");
    if (!FORM_ENDPOINT) { state.sent[kind] = { mode: "manual", text: text }; render(); return; }
    var data = {};
    pairs.forEach(function (p) { data[p[0]] = p[1]; });
    state.sent[kind] = { mode: "sending" };
    render();
    fetch(FORM_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(data) })
      .then(function (r) { if (!r.ok) throw new Error("http"); state.sent[kind] = { mode: "sent" }; render(); })
      .catch(function () { state.sent[kind] = { mode: "failed", text: text }; render(); });
  }

      el("div", { class: "row2" },
        field("a-pkg", "Paket", select("a-pkg", list.map(function (p) { return [p.key, p.name + " (CHF " + chf(p.price) + " " + p.unit + ")"]; }).concat([["offen", "Noch offen, bitte beraten"]]))),
        field("a-place", "Ort oder Region (freiwillig)", el("input", { id: "a-place", type: "text", autocomplete: "off", placeholder: "z. B. Weggis" }))
      ),
      field("a-msg", "Nachricht (freiwillig)", el("textarea", { id: "a-msg", maxlength: "1200", placeholder: cat === "sponsoring" ? "Was möchtest du unterstützen" : "Was möchtest du bewerben und wann" })),
      honeypot("a-hp"),
      el("button", { class: "primary", type: "submit", text: "Anfrage senden" })
    );

    var intro = cat === "werbung"
      ? "Werbung ist eine Botschaft mit Angebot. Hotels, Bergbahnen, Gepäckdienste und andere Betriebe zeigen sich auf dem Brett, dort wo Reisen geplant werden."
      : "Sponsoring heisst, die Plattform zu unterstützen, ohne etwas zu verkaufen. Dein Name steht dort, wo Menschen Vertrauen aufbauen. Das passt für Gemeinden, Vereine und Betriebe, die die Region stärken wollen.";
    var demo;
    if (cat === "werbung") {
      demo = el("section", { class: "section" }, el("h2", { text: "So sieht eine Anzeige aus" }), adSlip());
    } else {
      demo = el("section", { class: "section" },
        el("h2", { text: "So sieht Sponsoring aus" }),
        el("div", { class: "sponsor-demo" },
          el("div", { class: "eyebrow", text: "Unterstützt von" }),
          el("div", { class: "line", text: "Muster-Hotel am See · Beispiel Verein Weggis" }),
          el("div", { class: "by", text: "Strecken-Pate" }),
          el("div", { class: "line", text: "Luzern → Weggis, präsentiert von Muster-Hotel am See" }),
          el("p", { class: "detail", text: "Beispiele mit erfundenen Namen. Sponsoring trägt den Hinweis «Gesponsert» oder «Unterstützt von» und enthält keine Verkaufsbotschaft." })
        )
      );
    }
    var rules = cat === "werbung"
      ? [["Klar markiert", "Jede Anzeige trägt den Hinweis «Anzeige». Sie sieht aus wie ein Zettel, wird aber nie als normaler Zettel dargestellt."], ["Keine Kontaktdaten für Werbende", "Die Kontakte auf den Zetteln bleiben bei den Nutzenden. Werbende bekommen sie nicht."]]
      : [["Unabhängig bleiben", "Sponsoring hat keinen Einfluss auf Bewertungen und darauf, welche Zettel angezeigt werden."], ["Offen gezeigt", "Sponsoren stehen mit Namen auf der Plattform. Der Hinweis «Unterstützt von» ist immer sichtbar."]];

    return el("div", { class: "stack" },
      el("div", { class: "eyebrow", text: "Mit " + BRAND + " sichtbar werden" }),
      el("h1", { class: "mid", text: "Werbung und Sponsoring" }),
      segment("Kategorie", [["werbung", "Werbung"], ["sponsoring", "Sponsoring"]], cat, function (v) { state.adsCat = v; render(); }),
      el("p", { class: "lead", text: intro }),
      el("section", { class: "section" },
        el("h2", { text: cat === "werbung" ? "Werbepakete" : "Sponsoring-Pakete" }),
        cards,
        el("p", { class: "formnote", text: "Preise und Bedingungen sind Vorschläge für den Start. Wir sind am Anfang und haben noch keine Reichweitenzahlen. Frag nach dem aktuellen Stand." })
      ),
      demo,
      el("ul", { class: "principles" }, rules.map(function (r) { return el("li", {}, el("h3", { text: r[0] }), el("p", { text: r[1] })); })),
      el("section", { class: "section" },
        el("h2", { text: "Anfrage senden" }),
        form
      )
    );
  }

  function orText(v, fallback) { return v ? v : fallback; }
  function legalBanner() {
    if (!LEGAL_DRAFT) return null;
    return el("div", { class: "done warn" }, el("h2", { text: "Entwurf" }), el("p", { text: "Dieser Text ist ein Entwurf und noch nicht rechtlich geprüft. Er ersetzt keine Rechtsberatung." }));
  }
  function lsec(title, nodes) {
    return el("section", {}, el("h2", { text: title }), nodes);
  }
  function para(t) { return el("p", { text: t }); }
  function bullets(items) { return el("ul", {}, items.map(function (t) { return el("li", { text: t }); })); }

  function impressumView() {
    var later = "wird vor dem Start ergänzt";
    return el("div", { class: "stack" },
      el("div", { class: "eyebrow", text: "Rechtliches" }),
      el("h1", { class: "mid", text: "Impressum" }),
      legalBanner(),
      el("div", { class: "legal" },
        lsec("Betreiber", el("dl", { class: "facts" },
          el("div", {}, el("dt", { text: "Name" }), el("dd", { text: "Noah Balthasar" })),
          el("div", {}, el("dt", { text: "Funktion" }), el("dd", { text: "Gründer von " + BRAND })),
          el("div", {}, el("dt", { text: "Adresse" }), el("dd", { text: orText(ADDRESS, later) })),
          el("div", {}, el("dt", { text: "Kontakt" }), el("dd", { text: orText(CONTACT, later) })),
          el("div", {}, el("dt", { text: "Rechtsform" }), el("dd", { text: orText(LEGAL_FORM, later) })),
          el("div", {}, el("dt", { text: "Land" }), el("dd", { text: "Schweiz" }))
        )),
        lsec("Inhalt dieser Seite", [para("Die Inhalte wurden mit Sorgfalt erstellt. Für Richtigkeit, Vollständigkeit und Aktualität gibt es keine Gewähr.")]),
        lsec("Zettel, Bewertungen und Nachrichten von Nutzenden", [
          para("Zettel, Bewertungen und Nachrichten stammen von den Nutzenden. Wir prüfen sie nicht vorab und vermitteln nur den Kontakt."),
          para("Vereinbarungen über Fahrten und Transporte treffen die Nutzenden untereinander. Für Schäden aus solchen Vereinbarungen übernehmen wir, soweit gesetzlich zulässig, keine Haftung. Haftung und Versicherung sind noch nicht abschliessend geklärt."),
          para("Hinweise auf unpassende Zettel nehmen wir über das Kontaktformular entgegen.")
        ]),
        lsec("Anzeigen und Sponsoring", [para("Anzeigen und gesponserte Inhalte sind als solche gekennzeichnet.")]),
        lsec("Links auf andere Seiten", [para("Verlinkte Seiten Dritter liegen ausserhalb unseres Einflusses. Für deren Inhalte sind allein die jeweiligen Betreiber verantwortlich.")]),
        lsec("Urheberrecht", [para("Texte und Gestaltung dieser Seite sind urheberrechtlich geschützt. Eine Nutzung ausserhalb der gesetzlichen Schranken braucht unsere Zustimmung.")])
      )
    );
  }

  function datenschutzView() {
    var later = "wird vor dem Start ergänzt";
    return el("div", { class: "stack" },
      el("div", { class: "eyebrow", text: "Rechtliches" }),
      el("h1", { class: "long", text: "Datenschutzerklärung" }),
      legalBanner(),
      el("div", { class: "legal" },
        para("Stand Oktober 2026. Diese Erklärung beschreibt, wie " + BRAND + " Personendaten nach dem Schweizer Datenschutzgesetz bearbeitet."),
        lsec("Wer verantwortlich ist", [
          para("Noah Balthasar, Gründer von " + BRAND + ", Schweiz."),
          para("Adresse: " + orText(ADDRESS, later) + ". Kontakt: " + orText(CONTACT, later) + ".")
        ]),
        lsec("Welche Daten wir bearbeiten", [
          para("Zettel und Bewertungen. Was du auf einem Zettel oder in einer Bewertung einträgst, etwa Orte, Datum, Vorname und Kontakt, wird heute nur im lokalen Speicher deines Browsers abgelegt. Es wird nicht an uns übermittelt. Du kannst es löschen, indem du Zettel entfernst oder die Website-Daten in deinem Browser löschst."),
          para("Nachrichten über die Formulare. Wenn du das Kontaktformular oder das Anfrageformular für Werbung und Sponsoring nutzt, bearbeiten wir deine Angaben, also Thema, Nachricht, Name und Kontakt. Wir brauchen sie, um dir zu antworten."),
          para(FORM_ENDPOINT ? "Die Nachricht wird über einen Formular-Dienst an uns zugestellt. Dieser Dienst kann Daten auch im Ausland bearbeiten." : "Zurzeit wird über die Formulare nichts versendet. Die Nachricht bleibt in deinem Browser, bis du sie selbst weiterschickst."),
          para("Technische Daten. Beim Aufruf der Seite fallen beim Hosting-Anbieter technische Daten an, zum Beispiel IP-Adresse, Zeitpunkt und Browser.")
        ]),
        lsec("Hosting", [para("Die Seite wird bei folgendem Anbieter betrieben: " + HOSTING + ". Dabei kann deine IP-Adresse in die USA übermittelt werden.")]),
        lsec("Schriftarten", [para("Die Seite lädt Schriftarten von Google Fonts (fonts.googleapis.com und fonts.gstatic.com). Dabei erhält Google deine IP-Adresse, und sie kann in die USA übermittelt werden.")]),
        lsec("Cookies und Tracking", [para("Wir setzen keine Cookies und keine Analyse- oder Werbe-Tracker ein. Die Seite nutzt den lokalen Speicher deines Browsers, damit deine Zettel und Bewertungen erhalten bleiben.")]),
        lsec("Weitergabe", [para("Kontaktdaten von Zetteln geben wir nicht an Werbende oder Sponsoren weiter. Wenn wir ein gemeinsames Brett einführen, bei dem Zettel für andere sichtbar sind, passen wir diese Erklärung vorher an.")]),
        lsec("Aufbewahrung", [para("Nachrichten über die Formulare bewahren wir so lange auf, wie es für die Bearbeitung nötig ist oder das Gesetz es verlangt.")]),
        lsec("Deine Rechte", [
          para("Du kannst Auskunft über deine Daten verlangen. Du kannst sie berichtigen oder löschen lassen und der Bearbeitung widersprechen. Schreib dazu über das Kontaktformular."),
          para("Du kannst dich auch an den Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB) wenden.")
        ]),
        lsec("Änderungen", [para("Wir passen diese Erklärung an, wenn sich die Seite ändert. Es gilt die jeweils veröffentlichte Fassung.")])
      )
    );
  }

  function render() {
    var views = { landing: landingView, about: aboutView, wizard: wizardView, form: formView, done: doneView, board: boardView, ads: adsView, contact: contactView, impressum: impressumView, datenschutz: datenschutzView };
    var v = document.getElementById("view");
    v.replaceChildren((views[state.view] || landingView)());
    document.getElementById("boardCount").textContent = String(state.entries.length);
    [["boardBtn", "board"], ["adsBtn", "ads"], ["aboutBtn", "about"], ["contactBtn", "contact"]].forEach(function (p) {
      var b = document.getElementById(p[0]);
      if (state.view === p[1]) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    var key = state.view + ":" + state.step + ":" + (state.sent.contact || state.sent.ads ? "r" : "");
    if (key !== lastKey) { lastKey = key; window.scrollTo(0, 0); }
  }

  document.getElementById("brandName").textContent = BRAND;
  document.getElementById("regionTag").textContent = REGION;
  document.getElementById("brandBtn").addEventListener("click", function () { go("landing"); });
  document.getElementById("boardBtn").addEventListener("click", function () { go("board"); });
  document.getElementById("adsBtn").addEventListener("click", function () { goAds(state.adsCat); });
  document.getElementById("aboutBtn").addEventListener("click", function () { go("about"); });
  document.getElementById("contactBtn").addEventListener("click", function () { go("contact"); });
  document.getElementById("impBtn").addEventListener("click", function () { go("impressum"); });
  document.getElementById("dsBtn").addEventListener("click", function () { go("datenschutz"); });
  load();
  render();
})();
</script>
